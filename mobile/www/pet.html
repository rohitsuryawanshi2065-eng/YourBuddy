<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nudge Buddy — Dock buddy</title>
<style>
html,body{margin:0;width:100%;height:100%;background:transparent!important;overflow:hidden;user-select:none;-webkit-user-select:none;font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif}
#pet{position:absolute;left:0;bottom:0;width:var(--w);height:var(--h);cursor:grab;will-change:transform;transition:opacity .35s}
#pet.gone{opacity:0;pointer-events:none}
#pet.dragging{cursor:grabbing}
#pet .flip{position:absolute;inset:0;transition:transform .15s}
#pet .flip.left{transform:scaleX(-1)}
#pet .sway{position:absolute;inset:0;transform-origin:50% 0}
#pet.dragging .sway{animation:dangle .9s ease-in-out infinite alternate}
@keyframes dangle{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
#pet.sleep .nb-eyes{animation:none;transform:scaleY(.12)}
#pet.sleep .nb-inner{animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.03,.97)}}
#pet.land .nb-inner{animation:nb-squash .45s cubic-bezier(.3,1.6,.5,1) 1}
#pet.hop .nb-inner{animation:none}
#pet.look .nb-inner{animation:peek 1.6s ease-in-out}
@keyframes peek{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.bubble{position:absolute;left:50%;bottom:calc(100% + 4px);transform:translateX(-50%) scale(.4);transform-origin:50% 100%;background:#fff;color:#241a3a;font-weight:800;font-size:13px;line-height:1.25;padding:7px 11px;border-radius:13px;box-shadow:0 6px 18px rgba(0,0,0,.25);white-space:nowrap;opacity:0;transition:opacity .18s,transform .3s cubic-bezier(.2,1.8,.4,1);pointer-events:none}
.bubble:after{content:"";position:absolute;left:50%;margin-left:-7px;bottom:-6px;border:7px solid transparent;border-top-color:#fff;border-bottom:0}
.bubble.on{opacity:1;transform:translateX(-50%) scale(1)}
.zzz{position:absolute;right:-6px;top:6%;font-weight:900;color:#7c4dff;font-size:16px;opacity:0;pointer-events:none;text-shadow:0 1px 0 #fff,0 0 6px #fff}
#pet.sleep .zzz{animation:zzz 2.4s ease-in-out infinite}
@keyframes zzz{0%{opacity:0;transform:translate(0,8px) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translate(14px,-22px) scale(1.2)}}
.puff{position:absolute;border-radius:50%;background:#fff;pointer-events:none;box-shadow:0 0 0 1px rgba(0,0,0,.05)}
</style>
</head>
<body>
<div id="pet" class="gone"><div class="sway"><div class="flip"></div></div><div class="zzz">z Z</div><div class="bubble" id="bubble"></div></div>
<script src="characters.js"></script>
<script src="overlay.js"></script>
<script src="sounds.js"></script>
<script type="module" src="pet.js"></script>
</body>
</html>

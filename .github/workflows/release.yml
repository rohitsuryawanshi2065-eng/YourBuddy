# Builds the desktop app on real Mac + Windows machines and the Android APK, then publishes ONE
# GitHub Release with all installers. Trigger: push a tag like v1.1.1  (git tag v1.1.1 && git push --tags)
name: Release desktop app
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run sync
      - name: Build installer (no publishing here)
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci --no-audit --no-fund
      - name: Copy the shared web app into the Android project
        run: node scripts/sync.js && npx cap sync android
      - name: Build signed APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          V="${GITHUB_REF_NAME#v}"; IFS=. read -r MA MI PA <<< "$V"
          export NB_VERSION_NAME="$V" NB_VERSION_CODE=$(( ${MA:-1}*10000 + ${MI:-0}*100 + ${PA:-0} ))
          chmod +x gradlew && ./gradlew --no-daemon assembleRelease
          mkdir -p ../../out && cp app/build/outputs/apk/release/app-release.apk ../../out/Nudge-Buddy-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: installer-android
          path: out/Nudge-Buddy-android.apk
          if-no-files-found: error

  publish:
    # Runs once, after all builds → exactly one release, so "latest" always has every file.
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Keep the old Mac filename working (alias of the Apple silicon build)
        run: cp out/Nudge-Buddy-mac-arm64.dmg out/Nudge-Buddy-mac.dmg
      - run: ls -la out
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --title "Nudge Buddy $TAG" --notes "Download for Mac (Apple silicon or Intel), Windows or Android." --latest
